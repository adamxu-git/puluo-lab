- id: session-log-deepseek
  disabled: true
- insert:
    - id: puluo-browser
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: browser
        transport: stdio
        command: /opt/puluo/browser-tools/node_modules/.bin/playwright-mcp
        args: [--headless, --browser, chromium, --isolated]
        cwd: !!js process.cwd()
        env:
          PLAYWRIGHT_BROWSERS_PATH: /opt/puluo/browser
