http_port 127.0.0.2:3128
visible_hostname puluo-browser
pid_filename none
cache deny all
cache_mem 32 MB
access_log none
cache_log stdio:/dev/stderr
forwarded_for delete
dns_nameservers 1.1.1.1 223.5.5.5
dns_timeout 10 seconds
connect_timeout 12 seconds

acl client src 127.0.0.1/32
acl safe_ports port 80 443
acl tls_port port 443
acl reserved_names dstdomain -n .localhost .local .internal .home.arpa
acl reserved_ip dst "/etc/puluo/browser-deny-ipv4.txt"
http_access deny !client
http_access deny manager
http_access deny !safe_ports
http_access deny CONNECT !tls_port
http_access deny reserved_names
http_access deny to_localhost
http_access deny to_linklocal
http_access deny reserved_ip
http_access allow client
http_access deny all
